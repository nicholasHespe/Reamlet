# ───────────────────────────────────────────────────────────────
#  Reamlet CI — lint, type-check, and build on every push / PR
# ───────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────
#  Shared setup
# ─────────────────────────────────────────────────────────────

jobs:
  # ──────────────────────────────
  #  Linter
  # ──────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run ESLint on the sources and the test suite.
      # Why not renderer/? That folder is plain JS/HTML that
      # isn't part of the TypeScript project — lint what you own.
      - name: Lint
        run: pnpm exec eslint src/ test/

  # ──────────────────────────────
  #  Type-check
  # ──────────────────────────────
  typecheck:
    name: Type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (main process)
        run: pnpm exec tsc -p tsconfig.main.json --noEmit

      - name: Type-check (renderer process)
        run: pnpm exec tsc -p tsconfig.renderer.json --noEmit

  # ──────────────────────────────
  #  Tests
  # ──────────────────────────────
  # Saved-annotation geometry is easy to break without noticing: nothing on
  # screen changes, only the coordinates written into the file. These tests
  # embed annotations into synthetic pages of many shapes and read the
  # coordinates back out, so a bad transform fails here instead of in a user's
  # saved document.
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  # ──────────────────────────────
  #  Printing
  # ──────────────────────────────
  # The tests above check the print job Reamlet builds. This prints real jobs
  # through the app's own print path to a PDF printer, then checks that the
  # pages which come out show what was sent. A blank printout fails here
  # whether the job, Electron or the OS print pipeline blanked it.
  print:
    name: Print (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            pnpm-store: ~/.local/share/pnpm/store
          - name: Windows
            os: windows-latest
            pnpm-store: ~/AppData/Local/pnpm/store

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ matrix.pnpm-store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile TypeScript
        run: pnpm run build

      # CUPS-PDF writes each job to ~/PDF.
      - name: Add a PDF printer (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cups printer-driver-cups-pdf xvfb
          sudo lpadmin -p ReamletTestPDF -v cups-pdf:/ -m lsb/usr/cups-pdf/CUPS-PDF_opt.ppd -E
          echo "REAMLET_TEST_PRINTER=ReamletTestPDF" >> "$GITHUB_ENV"
          echo "REAMLET_TEST_PRINT_OUTPUT=$HOME/PDF" >> "$GITHUB_ENV"

      # Microsoft Print to PDF asks where to save unless its port is a file,
      # so this printer's port is one.
      - name: Add a PDF printer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'printed'
          New-Item -ItemType Directory -Force $out | Out-Null
          $port = Join-Path $out 'printout.pdf'
          Add-PrinterPort -Name $port
          Add-Printer -Name 'ReamletTestPDF' -DriverName 'Microsoft Print To PDF' -PortName $port
          "REAMLET_TEST_PRINTER=ReamletTestPDF" >> $env:GITHUB_ENV
          "REAMLET_TEST_PRINT_OUTPUT=$out" >> $env:GITHUB_ENV

      - name: Print through Reamlet (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm exec electron --no-sandbox test/e2e/print.mjs
        env:
          REAMLET_TEST_PRINT_RESULTS: ${{ runner.temp }}/print-results

      - name: Print through Reamlet (Windows)
        if: runner.os == 'Windows'
        run: pnpm exec electron test/e2e/print.mjs
        env:
          REAMLET_TEST_PRINT_RESULTS: ${{ runner.temp }}/print-results

      # Each job as sent and as printed, to look at when a layout fails.
      - name: Upload print results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: print-results-${{ matrix.name }}
          path: ${{ runner.temp }}/print-results
          retention-days: 7

  # ──────────────────────────────
  #  Build 
  # ──────────────────────────────

  # Linux smoke test (fast, cheap — catches most packaging bugs)
  build-linux:
    name: Build (Linux)
    needs: [lint, typecheck, test]    # Only if lint, types and tests pass
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile TypeScript
        run: pnpm run build

      - name: Package Electron app
        run: pnpm exec electron-builder --linux dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Windows build — the real deal for your target platform
  build-windows:
    name: Build (Windows)
    needs: [lint, typecheck, test]
    runs-on: windows-latest           # Windows runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile TypeScript
        run: pnpm run build

      # Build the NSIS installer + portable exe — same as your
      # local "pnpm run build-win" but on a clean machine.
      # This catches Windows-specific issues like path separators,
      # icon formats, and NSIS config problems.
      - name: Package Windows installer + portable
        run: pnpm exec electron-builder --win nsis portable --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload the built artifacts so you can download and test
      # them directly from the Actions tab — no local build needed.
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*.exe
          retention-days: 7           # Auto-delete after a week
